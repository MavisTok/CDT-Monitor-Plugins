{
  "name": "CDT Monitor",
  "description": "v0.5.0 · 阿里云CDT监控。填好AccessKey ID与Secret并保存后查询；普通用户不运行Setup。刷新与面板只查询；Monitor每10分钟执行已启用的自动策略。History查看日志；Notify-Test测试通知；Start/Stop手动启停；Setup只导入完整高级JSON。",
  "homepage": "https://github.com/MavisTok/CDT-Monitor-Plugins",
  "manual": "https://github.com/MavisTok/CDT-Monitor-Plugins/blob/main/egern/README.md",
  "env_schema": {
    "config_source": {
      "name": "配置来源",
      "description": "普通单账号保持module：填好两项密钥并保存后运行CDT-Refresh；local用于已导入的高级多账号JSON",
      "default_value": "module"
    },
    "account_id": {
      "name": "账号记录ID",
      "description": "稳定且唯一的记录 ID",
      "default_value": "ecs-1"
    },
    "account_name": {
      "name": "显示名称",
      "description": "面板显示名称",
      "default_value": "ECS"
    },
    "access_key_id": {
      "name": "必填·AccessKey ID",
      "description": "必填：与AccessKey Secret配对。只填ID不能查询；保存后运行CDT-Refresh，不要运行CDT-Setup",
      "default_value": "未设置"
    },
    "access_key_secret": {
      "name": "必填·AccessKey Secret",
      "description": "必填：填写该AccessKey ID对应的Secret；参数表模式无需导入JSON",
      "default_value": "未设置"
    },
    "region_id": {
      "name": "实例地域",
      "description": "实例地域",
      "default_value": "cn-hongkong"
    },
    "instance_id": {
      "name": "实例ID（仅查流量可不填）",
      "description": "完整 ECS 实例 ID；未设置则仅查流量",
      "default_value": "未设置"
    },
    "site_type": {
      "name": "阿里云站点",
      "description": "china 中国站 / international 国际站",
      "default_value": "china"
    },
    "max_traffic_gib": {
      "name": "流量额度GiB",
      "description": "账号分类额度，单位 GiB，请按实际额度修改",
      "default_value": "200"
    },
    "threshold_percent": {
      "name": "告警阈值百分比",
      "description": "告警阈值百分比",
      "default_value": "95"
    },
    "allow_control": {
      "name": "实例控制总开关",
      "description": "实例控制总开关 true / false",
      "default_value": "false"
    },
    "threshold_action": {
      "name": "达到阈值后的操作",
      "description": "notify 仅通知 / stop 停机并通知",
      "default_value": "notify"
    },
    "shutdown_mode": {
      "name": "停机模式",
      "description": "KeepCharging 普通停机 / StopCharging 节省停机",
      "default_value": "KeepCharging"
    },
    "keep_alive": {
      "name": "实例保活",
      "description": "实例保活 true / false",
      "default_value": "false"
    },
    "schedule_enabled": {
      "name": "定时启停开关",
      "description": "定时启停 true / false",
      "default_value": "false"
    },
    "start_time": {
      "name": "每天启动时间",
      "description": "定时启动 HH:mm",
      "default_value": "08:00"
    },
    "stop_time": {
      "name": "每天停止时间",
      "description": "定时停止 HH:mm",
      "default_value": "23:00"
    },
    "billing": {
      "name": "查询余额与账单",
      "description": "余额与账单查询 true / false",
      "default_value": "false"
    },
    "daily_report_time": {
      "name": "日报时间",
      "description": "日报 HH:mm；填写关闭可停用日报",
      "default_value": "21:00"
    },
    "timezone_offset_minutes": {
      "name": "时区偏移分钟",
      "description": "业务时区相对 UTC 的分钟偏移",
      "default_value": "480"
    },
    "request_timeout_seconds": {
      "name": "请求超时秒数",
      "description": "请求超时 3–15 秒",
      "default_value": "10"
    },
    "system_notification": {
      "name": "系统通知开关",
      "description": "系统通知 true / false",
      "default_value": "true"
    },
    "telegram_enabled": {
      "name": "Telegram通知开关",
      "description": "Telegram 通知 true / false",
      "default_value": "false"
    },
    "telegram_base_url": {
      "name": "Telegram接口地址",
      "description": "Telegram HTTPS API 或反代地址",
      "default_value": "https://api.telegram.org"
    },
    "telegram_bot_token": {
      "name": "Telegram机器人Token",
      "description": "Telegram Bot Token",
      "default_value": "未设置"
    },
    "telegram_chat_id": {
      "name": "Telegram接收者ID",
      "description": "Telegram 接收者 Chat ID",
      "default_value": "未设置"
    },
    "webhook_enabled": {
      "name": "Webhook通知开关",
      "description": "Webhook 通知 true / false",
      "default_value": "false"
    },
    "webhook_url": {
      "name": "Webhook地址",
      "description": "Webhook HTTPS 地址",
      "default_value": "未设置"
    },
    "webhook_authorization": {
      "name": "Webhook认证",
      "description": "Webhook Authorization 请求头；无需认证时保留未设置",
      "default_value": "未设置"
    },
    "control_account": {
      "name": "手动控制账号ID",
      "description": "仅手动启停：目标账号记录ID",
      "default_value": "ecs-1"
    },
    "control_confirm": {
      "name": "手动控制实例确认",
      "description": "仅手动启停：必须精确匹配完整实例ID",
      "default_value": "未设置"
    },
    "config_json": {
      "name": "高级JSON导入",
      "description": "仅高级多账号导入；普通用户留空，不运行Setup",
      "default_value": ""
    }
  },
